<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <title>Letter Reveal</title>
  <style>
    :root {
      --marker: "Permanent Marker", "Segoe Print", cursive;
      --bg: #f5f5f5;
      --surface: #ffffff;
      --surface-soft: #f0f2f5;
      --border: #dfe1e6;
      --border-strong: #c7cbd1;
      --text: #1c1c1c;
      --muted: #5f6670;
      --muted-light: #808791;
      --accent: #0067e6;
      --accent-soft: #e6f5ff;
      --danger: #f53c3c;
      --danger-soft: #fff2f0;
      --cell: clamp(34px, 13vw, 74px);
      --radius: 6px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(820px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-x: hidden;
      transition: width .65s cubic-bezier(.18,.92,.22,1), gap .45s ease;
    }
    .app.reveal-mode {
      width: min(980px, 100%);
      padding: max(10px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom));
      gap: 8px;
      --cell: clamp(30px, 12vw, 66px);
    }
    .app.reveal-mode header,
    .app.reveal-mode .entry-card {
      max-height: 0;
      margin: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(-46px);
      pointer-events: none;
    }
    .app.reveal-mode .tool-dock {
      opacity: 0;
      transform: translateY(-28px);
      pointer-events: none;
    }

    .brand-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 42px;
    }

    .synology-logo {
      display: block;
      width: 118px;
      height: auto;
      filter: brightness(0);
    }

    .db-logo {
      display: block;
      width: clamp(132px, 31vw, 190px);
      height: auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      max-height: 120px;
      opacity: 1;
      transform: translateY(0);
      transition:
        max-height .55s cubic-bezier(.2,.8,.2,1),
        padding .55s cubic-bezier(.2,.8,.2,1),
        border-width .55s ease,
        opacity .32s ease,
        transform .48s cubic-bezier(.2,.8,.2,1);
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 44px);
      line-height: .98;
      letter-spacing: 0;
      font-weight: 760;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: var(--radius);
      height: 44px;
      padding: 0 15px;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, color .18s ease;
    }
    .icon-btn:active { transform: scale(.96); }
    .icon-btn:not(:disabled):hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .icon-btn:disabled { opacity: .35; cursor: default; }

    .entry-card {
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
      border-radius: var(--radius);
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
      max-height: 86px;
      opacity: 1;
      transform: translateY(0);
      transition:
        max-height .55s cubic-bezier(.2,.8,.2,1),
        padding .55s cubic-bezier(.2,.8,.2,1),
        border-width .55s ease,
        opacity .32s ease,
        transform .48s cubic-bezier(.2,.8,.2,1);
    }

    #wordInput {
      min-width: 0;
      height: 54px;
      border: 0;
      outline: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--text);
      padding: 0 13px;
      font-size: 18px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      font-weight: 600;
    }
    #wordInput::placeholder {
      color: var(--muted-light);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      font-weight: 600;
    }

    .add-btn {
      height: 54px;
      border: 0;
      border-radius: 4px;
      background: var(--text);
      color: #fff;
      min-width: 72px;
      padding: 0 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease;
    }
    .add-btn:active { transform: scale(.96); }
    .demo-press {
      transform: scale(.96);
      box-shadow: 0 0 0 3px rgba(0,103,230,.18);
    }

    .stage {
      flex: 1;
      min-height: clamp(360px, 56svh, 680px);
      position: relative;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      padding: 24px 18px 26px;
      transition:
        min-height .65s cubic-bezier(.18,.92,.22,1),
        padding .65s cubic-bezier(.18,.92,.22,1);
    }
    .app.reveal-mode .stage {
      height: calc(100svh - 104px);
      min-height: 0;
      padding: clamp(30px, 5vw, 52px) clamp(12px, 3vw, 28px) 34px;
    }

    .stage::after {
      display: none;
    }

    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 40px;
      text-align: center;
      color: var(--muted-light);
      font-size: 15px;
      line-height: 1.5;
      transition: opacity .2s ease;
    }
    .stage.has-words .empty { opacity: 0; pointer-events: none; }

    .letter-board {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      overflow: visible;
      padding: 52px 0 2px;
    }
    .stage.grid-mode .letter-board {
      width: fit-content;
    }
    .app.reveal-mode .letter-board {
      padding-top: clamp(36px, 7.4vh, 52px);
    }

    .chosen-number {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 44%;
      opacity: 0;
      color: var(--text);
      font-size: clamp(54px, 18vw, 96px);
      line-height: 1;
      font-weight: 820;
      transform: translate(-50%, calc(-50% + 24px)) scale(.92);
      transition:
        opacity .3s ease,
        left .92s cubic-bezier(.18,.92,.22,1),
        right .92s cubic-bezier(.18,.92,.22,1),
        top .92s cubic-bezier(.18,.92,.22,1),
        transform .92s cubic-bezier(.18,.92,.22,1),
        font-size .92s cubic-bezier(.18,.92,.22,1);
      pointer-events: none;
    }
    .stage.show-number .chosen-number {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .stage.number-parked .chosen-number {
      left: auto;
      right: 18px;
      top: 15px;
      font-size: clamp(24px, 7vw, 38px);
      transform: translate(0, 0) scale(1);
    }

    .number-cursor {
      position: absolute;
      top: 46px;
      left: calc((var(--cursor-index, 1) - .5) * var(--cell));
      width: 24px;
      height: 24px;
      border: 2px solid var(--text);
      border-radius: 999px;
      opacity: 0;
      transform: translateX(-50%) scale(.72);
      transition:
        left .62s cubic-bezier(.2,.82,.2,1),
        opacity .22s ease,
        transform .22s ease,
        border-color .3s ease,
        box-shadow .3s ease;
      pointer-events: none;
    }
    .number-cursor.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    .number-cursor.selected {
      border-color: var(--danger);
      box-shadow: 0 0 0 4px var(--danger-soft);
    }

    .numbers {
      display: grid;
      grid-template-columns: repeat(6, var(--cell));
      justify-content: start;
      gap: 0;
      width: fit-content;
      margin: 0 0 13px;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity .45s ease .15s, transform .45s cubic-bezier(.2,.8,.2,1) .15s;
      pointer-events: none;
    }
    .stage.numbers-mode .numbers {
      opacity: 1;
      transform: translateY(0);
    }
    .number-label {
      width: var(--cell);
      text-align: center;
      color: var(--muted);
      font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      transition: color .3s ease, transform .3s ease;
    }
    .number-label.selected { color: var(--danger); transform: scale(1.13); }

    #words {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 2.4vw, 22px);
    }
    .stage.grid-mode #words { align-items: flex-start; }
    .app.reveal-mode #words {
      gap: clamp(6px, 1.6vh, 14px);
    }

    .word-row {
      min-height: clamp(50px, 8vw, 78px);
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-size: clamp(36px, 10.8vw, 68px);
      line-height: 1.15;
      font-family: var(--marker);
      font-weight: 400;
      letter-spacing: 0;
      transition: opacity .25s ease;
    }

    .letter {
      display: inline-block;
      position: relative;
      text-align: center;
      will-change: transform, opacity, color;
      transition:
        width 1.35s cubic-bezier(.18,.92,.22,1),
        color .45s ease,
        transform 1.35s cubic-bezier(.18,.92,.22,1),
        text-shadow .45s ease;
    }

    .stage.grid-mode .word-row {
      font-size: clamp(30px, 9.5vw, 58px);
      min-height: clamp(36px, 8vh, 64px);
      font-weight: 400;
      letter-spacing: 0;
    }
    .stage.grid-mode .letter { width: var(--cell); }
    .stage.grid-mode .letter.beyond-six {
      width: 0;
      opacity: 0;
      overflow: hidden;
    }
    .stage.grid-mode .letter.selected {
      color: var(--danger);
      transform: scale(1.11);
      text-shadow: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .reveal {
      position: relative;
      z-index: 2;
      text-align: center;
      min-height: 128px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-top: 18px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .4s ease, transform .5s cubic-bezier(.2,.8,.2,1);
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .app.reveal-mode .reveal {
      min-height: clamp(86px, 19vh, 150px);
      padding-top: 10px;
    }
    .reveal small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .answer {
      min-height: 74px;
      font-size: clamp(56px, 17vw, 104px);
      line-height: 1;
      font-family: var(--marker);
      font-weight: 400;
      letter-spacing: 0;
      color: var(--danger);
      text-transform: uppercase;
    }
    .answer-char {
      display: inline-block;
      opacity: 0;
      transform: translateY(-20px) scale(.75);
      filter: blur(5px);
      animation: land .55s cubic-bezier(.16,.95,.28,1.18) forwards;
    }
    @keyframes land {
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .reveal-reset {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 8;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity .3s ease, transform .35s cubic-bezier(.2,.8,.2,1);
    }
    .stage.reveal-finished .reveal-reset {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .tool-dock {
      position: fixed;
      left: 18px;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 20;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      opacity: 1;
      transform: translateY(0);
      transition: opacity .32s ease, transform .48s cubic-bezier(.2,.8,.2,1);
    }

    .tool-toggle {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 26px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    .tool-toggle:active { transform: scale(.96); }

    .tool-panel {
      width: min(260px, calc(100vw - 80px));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      display: grid;
      gap: 8px;
    }
    .tool-panel[hidden] { display: none; }
    .tool-panel .icon-btn {
      width: 100%;
      text-align: left;
      justify-content: flex-start;
    }

    .tutorial {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(245,245,245,.72);
    }
    .tutorial[hidden] { display: none; }
    .tutorial-card {
      width: min(460px, 100%);
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 12px 34px rgba(0,0,0,.16);
      padding: 18px;
    }
    .tutorial-count {
      margin: 0 0 8px;
      color: var(--muted-light);
      font-size: 12px;
      font-weight: 760;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .tutorial-title {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 760;
    }
    .tutorial-body {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .tutorial-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .shake { animation: shake .35s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-3px); }
    }

    @media (max-width: 390px) {
      .app { padding-left: 12px; padding-right: 12px; gap: 13px; }
      .brand-strip { gap: 10px; }
      .synology-logo { width: 96px; }
      .db-logo { width: 132px; }
      .stage { padding-left: 8px; padding-right: 8px; }
      .header-actions .icon-btn { height: 38px; padding: 0 10px; }
      .tool-dock { left: 12px; }
    }

    @media (max-width: 520px) {
      header {
        display: grid;
        grid-template-columns: 1fr;
        align-items: start;
      }
      .header-actions {
        width: 100%;
        justify-content: flex-end;
        flex-wrap: nowrap;
      }
      .header-actions .icon-btn {
        height: 38px;
        padding: 0 12px;
        white-space: nowrap;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand-strip">
      <img class="synology-logo" src="https://design.synology.com/img/logo/synology_logo_color.svg" alt="Synology" />
      <img class="db-logo" src="assets/db-logo-green.png" alt="Daniel Bower Magician and Host" />
    </div>

    <header>
      <div>
        <p class="eyebrow">Wikipedia</p>
        <h1>Letter Reveal</h1>
      </div>
      <div class="header-actions">
        <button id="undoBtn" class="icon-btn" type="button" disabled>Undo last word</button>
        <button id="resetBtn" class="icon-btn" type="button" disabled>Reset</button>
      </div>
    </header>

    <form id="wordForm" class="entry-card" autocomplete="off">
      <input id="wordInput" type="text" inputmode="text" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="Type the next word…" aria-label="Next word" />
      <button id="addBtn" class="add-btn" type="submit">Add</button>
    </form>

    <section id="stage" class="stage" aria-live="polite">
      <div class="empty">Add each word as it is called out.</div>
      <div class="letter-board">
        <div id="numberCursor" class="number-cursor" aria-hidden="true"></div>
        <div id="numbers" class="numbers" aria-hidden="true"></div>
        <div id="words"></div>
      </div>
      <div id="chosenNumber" class="chosen-number" aria-hidden="true"></div>
      <div id="reveal" class="reveal">
        <small>Selected letters</small>
        <div id="answer" class="answer"></div>
      </div>
      <button id="revealResetBtn" class="icon-btn reveal-reset" type="button">Reset</button>
    </section>

    <div class="tool-dock">
      <button id="toolsToggle" class="tool-toggle" type="button" aria-expanded="false" aria-controls="toolPanel" aria-label="Open tools">+</button>
      <div id="toolPanel" class="tool-panel" hidden>
        <button id="sampleBtn" class="icon-btn" type="button">Sample words</button>
        <button id="tutorialBtn" class="icon-btn" type="button">Tutorial for Stuart</button>
      </div>
    </div>

    <section id="tutorial" class="tutorial" hidden role="dialog" aria-modal="true" aria-labelledby="tutorialTitle">
      <div class="tutorial-card">
        <p id="tutorialCount" class="tutorial-count"></p>
        <h2 id="tutorialTitle" class="tutorial-title"></h2>
        <p id="tutorialBody" class="tutorial-body"></p>
        <div class="tutorial-actions">
          <button id="tutorialCloseBtn" class="icon-btn" type="button">Close</button>
          <button id="tutorialBackBtn" class="icon-btn" type="button">Back</button>
          <button id="tutorialNextBtn" class="icon-btn" type="button">Next</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const state = {
      words: [],
      selected: null,
      submitted: null,
      gridActive: false,
      triggerNumber: null,
      numberVisible: false,
      numberParked: false,
      numbersVisible: false,
      highlightedNumber: null,
      scannerPosition: null,
      revealMode: false,
      revealFinished: false,
      revealedRows: 0,
      answerReady: false,
      revealing: false,
      demoing: false,
      correcting: false,
      toolsOpen: false,
      tutorialOpen: false,
      tutorialStep: 0
    };

    const WIKIPEDIA_API = 'https://en.wikipedia.org/w/api.php';
    const tutorialSteps = [
      {
        title: 'Type the Wikipedia titles',
        body: 'Click in the word box, type the title as it is read out, then press Add. The page quietly tries to correct close Wikipedia spelling mistakes before it writes the word underneath.'
      },
      {
        title: 'Keep the page boring',
        body: 'Nothing magical should happen while the words are being entered. If one word is wrong, use Undo last word. If you need to start again, use Reset.'
      },
      {
        title: 'Use the secret trigger',
        body: 'When all the words are on the page, press the die result on the keyboard: 1, 2, 3, 4, 5, or 6. You do not need to click into any field first.'
      },
      {
        title: 'Let the animation finish',
        body: 'The chosen digit appears large in the centre, moves to the top right, then the letters line up and reveal themselves. Do not click anything while that is happening.'
      },
      {
        title: 'Practise with sample words',
        body: 'Open the tools button, press Sample words, wait for Manganese, Uranium, and Reservoir to be typed in, then press 3 on the keyboard.'
      }
    ];

    const app = document.querySelector('.app');
    const stage = document.getElementById('stage');
    const wordsEl = document.getElementById('words');
    const numberCursor = document.getElementById('numberCursor');
    const numbersEl = document.getElementById('numbers');
    const chosenNumberEl = document.getElementById('chosenNumber');
    const revealEl = document.getElementById('reveal');
    const answerEl = document.getElementById('answer');
    const wordForm = document.getElementById('wordForm');
    const wordInput = document.getElementById('wordInput');
    const addBtn = document.getElementById('addBtn');
    const undoBtn = document.getElementById('undoBtn');
    const resetBtn = document.getElementById('resetBtn');
    const revealResetBtn = document.getElementById('revealResetBtn');
    const toolsToggle = document.getElementById('toolsToggle');
    const toolPanel = document.getElementById('toolPanel');
    const sampleBtn = document.getElementById('sampleBtn');
    const tutorialBtn = document.getElementById('tutorialBtn');
    const tutorialEl = document.getElementById('tutorial');
    const tutorialCountEl = document.getElementById('tutorialCount');
    const tutorialTitleEl = document.getElementById('tutorialTitle');
    const tutorialBodyEl = document.getElementById('tutorialBody');
    const tutorialCloseBtn = document.getElementById('tutorialCloseBtn');
    const tutorialBackBtn = document.getElementById('tutorialBackBtn');
    const tutorialNextBtn = document.getElementById('tutorialNextBtn');

    function cleanWord(value) {
      return value.trim().replace(/\s+/g, ' ');
    }

    function titleKey(value) {
      return cleanWord(value).replace(/_/g, ' ').toLocaleLowerCase();
    }

    async function fetchWikipedia(params) {
      const url = new URL(WIKIPEDIA_API);
      const finalParams = { format: 'json', origin: '*', ...params };
      Object.entries(finalParams).forEach(([key, value]) => url.searchParams.set(key, value));

      const response = await fetch(url.toString(), { cache: 'no-store' });
      if (!response.ok) throw new Error(`Wikipedia returned ${response.status}`);
      return response.json();
    }

    function firstKnownPage(data) {
      const pages = data?.query?.pages || {};
      return Object.values(pages).find(page => !Object.prototype.hasOwnProperty.call(page, 'missing'));
    }

    async function findWikipediaTitle(value) {
      const data = await fetchWikipedia({
        action: 'query',
        redirects: '1',
        titles: value
      });
      const page = firstKnownPage(data);
      if (!page?.title) return null;

      const normalised = data.query?.normalized?.find(item => titleKey(item.from) === titleKey(value))?.to || value;
      const redirect = data.query?.redirects?.find(item => titleKey(item.from) === titleKey(normalised));
      return redirect ? redirect.from : page.title;
    }

    async function resolveWikipediaTitle(value) {
      const word = cleanWord(value);
      if (!word) return '';

      try {
        const direct = await findWikipediaTitle(word);
        if (direct) return direct;

        const search = await fetchWikipedia({
          action: 'query',
          list: 'search',
          srnamespace: '0',
          srlimit: '1',
          srsearch: word
        });
        const suggestion = search.query?.searchinfo?.suggestion;
        if (suggestion) {
          return await findWikipediaTitle(suggestion) || cleanWord(suggestion);
        }

        return search.query?.search?.[0]?.title || word;
      } catch (error) {
        return word;
      }
    }

    function charsOf(word) {
      return Array.from(word);
    }

    function eligible(word, n) {
      return charsOf(word.replace(/\s/g, '')).length >= n;
    }

    function displayChars(word) {
      return charsOf(word.replace(/\s/g, ''));
    }

    function renderKeyNumber() {
      chosenNumberEl.textContent = state.triggerNumber || '';
      app.classList.toggle('reveal-mode', state.revealMode);
      stage.classList.toggle('show-number', state.numberVisible);
      stage.classList.toggle('number-parked', state.numberParked);
      stage.classList.toggle('numbers-mode', state.numbersVisible);
      stage.classList.toggle('reveal-finished', state.revealFinished);
    }

    function renderNumbers() {
      numbersEl.innerHTML = '';
      for (let i = 1; i <= 6; i++) {
        const el = document.createElement('div');
        el.className = 'number-label' + (state.highlightedNumber === i ? ' selected' : '');
        el.textContent = i;
        numbersEl.appendChild(el);
      }
    }

    function renderNumberCursor() {
      numberCursor.classList.toggle('visible', state.scannerPosition !== null);
      numberCursor.classList.toggle('selected', state.highlightedNumber !== null);
      if (state.scannerPosition !== null) {
        numberCursor.style.setProperty('--cursor-index', state.scannerPosition);
      }
    }

    function renderControls() {
      addBtn.disabled = state.revealing || state.demoing || state.correcting;
      sampleBtn.disabled = state.revealing || state.demoing || state.correcting;
      tutorialBtn.disabled = state.revealing || state.demoing || state.correcting;
      toolsToggle.disabled = state.revealing || state.demoing || state.correcting;
      toolPanel.hidden = !state.toolsOpen;
      toolsToggle.setAttribute('aria-expanded', String(state.toolsOpen));
      toolsToggle.textContent = state.toolsOpen ? '-' : '+';
      toolsToggle.setAttribute('aria-label', state.toolsOpen ? 'Close tools' : 'Open tools');
    }

    function renderTutorial() {
      tutorialEl.hidden = !state.tutorialOpen;
      if (!state.tutorialOpen) return;

      const step = tutorialSteps[state.tutorialStep];
      tutorialCountEl.textContent = `Step ${state.tutorialStep + 1} of ${tutorialSteps.length}`;
      tutorialTitleEl.textContent = step.title;
      tutorialBodyEl.textContent = step.body;
      tutorialBackBtn.disabled = state.tutorialStep === 0;
      tutorialNextBtn.textContent = state.tutorialStep === tutorialSteps.length - 1 ? 'Replay' : 'Next';
    }

    function renderWords() {
      wordsEl.innerHTML = '';
      state.words.forEach((word, rowIndex) => {
        const row = document.createElement('div');
        row.className = 'word-row';
        row.dataset.row = rowIndex;

        displayChars(word).forEach((char, charIndex) => {
          const span = document.createElement('span');
          span.className = 'letter';
          span.dataset.key = `${rowIndex}-${charIndex}`;
          if (charIndex >= 6) span.classList.add('beyond-six');
          if (state.submitted && charIndex === state.submitted - 1 && rowIndex < state.revealedRows) span.classList.add('selected');
          span.textContent = char;
          row.appendChild(span);
        });
        wordsEl.appendChild(row);
      });

      stage.classList.toggle('has-words', state.words.length > 0);
      stage.classList.toggle('grid-mode', state.gridActive);
      undoBtn.disabled = state.words.length === 0 || state.revealing || state.demoing;
      resetBtn.disabled = (state.words.length === 0 && state.submitted === null && state.triggerNumber === null) || state.demoing;
    }

    function renderAnswer(animated = false) {
      answerEl.innerHTML = '';
      if (!state.answerReady || !state.submitted) {
        revealEl.classList.remove('visible');
        return;
      }

      const letters = state.words.map(word => {
        const chars = displayChars(word);
        return chars[state.submitted - 1] || '·';
      });

      letters.forEach((char, index) => {
        const span = document.createElement('span');
        span.className = 'answer-char';
        span.textContent = char.toUpperCase();
        span.style.animationDelay = animated ? `${360 + index * 110}ms` : '0ms';
        answerEl.appendChild(span);
      });

      setTimeout(() => revealEl.classList.add('visible'), animated ? 300 : 0);
    }

    function clearReveal() {
      state.submitted = null;
      state.gridActive = false;
      state.triggerNumber = null;
      state.numberVisible = false;
      state.numberParked = false;
      state.numbersVisible = false;
      state.highlightedNumber = null;
      state.scannerPosition = null;
      state.revealMode = false;
      state.revealFinished = false;
      state.revealedRows = 0;
      state.answerReady = false;
      revealEl.classList.remove('visible');
      answerEl.innerHTML = '';
    }

    function sync(animatedAnswer = false) {
      renderKeyNumber();
      renderNumbers();
      renderNumberCursor();
      renderWords();
      renderControls();
      renderTutorial();
      renderAnswer(animatedAnswer);
    }

    async function addWord(raw, options = {}) {
      let word = cleanWord(raw);
      if (!word) return false;

      if (options.correct !== false) {
        state.correcting = true;
        renderControls();
        word = await resolveWikipediaTitle(word);
        state.correcting = false;
      }

      if (state.submitted !== null || state.gridActive) clearReveal();

      state.words.push(word);
      wordInput.value = '';
      if (options.sync !== false) sync(false);
      if (options.focus !== false) wordInput.focus();
      return true;
    }

    function captureLetterPositions() {
      const positions = new Map();
      document.querySelectorAll('.letter').forEach(letter => {
        positions.set(letter.dataset.key, letter.getBoundingClientRect());
      });
      return positions;
    }

    function animateLettersFrom(previousPositions) {
      const letters = [...document.querySelectorAll('.letter')];
      letters.forEach(letter => {
        const previous = previousPositions.get(letter.dataset.key);
        if (!previous) return;

        const next = letter.getBoundingClientRect();
        const dx = previous.left - next.left;
        const dy = previous.top - next.top;
        letter.style.transition = 'none';
        letter.style.transform = `translate(${dx}px, ${dy}px)`;
      });

      document.body.offsetHeight;

      letters.forEach(letter => {
        letter.style.transition = '';
        letter.style.transform = '';
      });
    }

    function animateNumberFrom(previous) {
      const next = chosenNumberEl.getBoundingClientRect();
      const dx = previous.left - next.left;
      const dy = previous.top - next.top;
      chosenNumberEl.style.transition = 'none';
      chosenNumberEl.style.transform = `translate(${dx}px, ${dy}px) scale(1)`;

      document.body.offsetHeight;

      chosenNumberEl.style.transition = '';
      chosenNumberEl.style.transform = '';
    }

    function keyNumber(event) {
      if (/^[1-6]$/.test(event.key)) return Number(event.key);
      const match = /^Numpad([1-6])$/.exec(event.code);
      return match ? Number(match[1]) : null;
    }

    async function submitReveal(number) {
      if (state.revealing || state.correcting || state.demoing) return;

      const selectedNumber = Number(number);
      if (!Number.isInteger(selectedNumber) || selectedNumber < 1 || selectedNumber > 6) return;

      if (cleanWord(wordInput.value)) {
        const added = await addWord(wordInput.value, { sync: false, focus: false });
        if (!added) return;
      }

      if (!state.words.length) {
        sync(false);
        return;
      }

      renderWords();
      renderControls();

      const invalidRows = state.words
        .map((word, index) => ({ word, index }))
        .filter(({ word }) => !eligible(word, selectedNumber));

      if (invalidRows.length) {
        const row = wordsEl.querySelector(`[data-row="${invalidRows[0].index}"]`);
        if (row) {
          row.classList.remove('shake');
          void row.offsetWidth;
          row.classList.add('shake');
        }
        wordInput.placeholder = `A word is shorter than ${selectedNumber} letters`;
        setTimeout(() => wordInput.placeholder = 'Type the next word…', 1700);
        renderControls();
        return;
      }

      state.revealing = true;
      state.triggerNumber = selectedNumber;
      state.numberVisible = true;
      state.numberParked = false;
      state.numbersVisible = false;
      state.highlightedNumber = null;
      state.scannerPosition = null;
      state.revealMode = false;
      state.revealFinished = false;
      state.submitted = selectedNumber;
      state.gridActive = false;
      state.revealedRows = 0;
      state.answerReady = false;
      revealEl.classList.remove('visible');
      answerEl.innerHTML = '';

      renderKeyNumber();
      renderWords();
      renderControls();

      await sleep(1900);

      const numberBeforePark = chosenNumberEl.getBoundingClientRect();
      state.numberParked = true;
      state.revealMode = true;
      renderKeyNumber();
      animateNumberFrom(numberBeforePark);

      await sleep(1050);

      const beforeGrid = captureLetterPositions();
      state.gridActive = true;
      renderWords();
      animateLettersFrom(beforeGrid);

      await sleep(1500);
      await sleep(500);

      state.numbersVisible = true;
      renderKeyNumber();
      renderNumbers();
      renderNumberCursor();
      renderWords();
      await sleep(500);

      state.scannerPosition = 1;
      renderNumberCursor();
      await sleep(selectedNumber === 1 ? 1000 : 700);

      for (let i = 2; i <= selectedNumber; i++) {
        state.scannerPosition = i;
        renderNumberCursor();
        await sleep(i === selectedNumber ? 1000 : 700);
      }

      state.highlightedNumber = selectedNumber;
      renderNumbers();
      renderNumberCursor();
      await sleep(500);

      for (let i = 1; i <= state.words.length; i++) {
        state.revealedRows = i;
        renderWords();
        await sleep(500);
      }

      await sleep(500);
      state.answerReady = true;
      renderAnswer(true);
      await sleep(820 + state.words.length * 110);

      state.revealing = false;
      state.revealFinished = true;
      renderKeyNumber();
      renderWords();
      renderControls();
    }

    function reset() {
      state.words = [];
      state.selected = null;
      clearReveal();
      state.revealing = false;
      state.demoing = false;
      state.correcting = false;
      sync(false);
      wordInput.value = '';
      wordInput.focus();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function flashPress(button) {
      button.classList.add('demo-press');
      await sleep(130);
      button.classList.remove('demo-press');
    }

    async function typeSampleWord(word) {
      wordInput.value = '';
      wordInput.focus();

      for (const char of charsOf(word)) {
        wordInput.value += char;
        renderControls();
        await sleep(82);
      }

      await sleep(180);
      await flashPress(addBtn);
      await addWord(wordInput.value, { focus: false, correct: false });
      await sleep(330);
    }

    async function playSample() {
      if (state.demoing || state.revealing) return;

      reset();
      state.demoing = true;
      state.toolsOpen = false;
      sync(false);

      await typeSampleWord('Manganese');
      await typeSampleWord('Uranium');
      await typeSampleWord('Reservoir');

      state.demoing = false;
      sync(false);
      wordInput.focus();
    }

    function openTutorial() {
      state.tutorialOpen = true;
      state.tutorialStep = 0;
      state.toolsOpen = false;
      sync(false);
    }

    function closeTutorial() {
      state.tutorialOpen = false;
      sync(false);
      wordInput.focus();
    }

    function nextTutorialStep() {
      if (state.tutorialStep === tutorialSteps.length - 1) {
        state.tutorialStep = 0;
      } else {
        state.tutorialStep += 1;
      }
      sync(false);
    }

    function previousTutorialStep() {
      state.tutorialStep = Math.max(0, state.tutorialStep - 1);
      sync(false);
    }

    function shouldLetInputKeepNumber(event) {
      return document.activeElement === wordInput && cleanWord(wordInput.value).length > 0 && !event.ctrlKey && !event.metaKey && !event.altKey;
    }

    wordForm.addEventListener('submit', async event => {
      event.preventDefault();
      await addWord(wordInput.value);
    });

    wordInput.addEventListener('input', renderControls);

    sampleBtn.addEventListener('click', playSample);

    toolsToggle.addEventListener('click', () => {
      state.toolsOpen = !state.toolsOpen;
      sync(false);
    });

    tutorialBtn.addEventListener('click', openTutorial);
    tutorialCloseBtn.addEventListener('click', closeTutorial);
    tutorialBackBtn.addEventListener('click', previousTutorialStep);
    tutorialNextBtn.addEventListener('click', nextTutorialStep);

    undoBtn.addEventListener('click', () => {
      if (!state.words.length || state.revealing) return;
      state.words.pop();
      clearReveal();
      sync(false);
      wordInput.focus();
    });

    resetBtn.addEventListener('click', reset);
    revealResetBtn.addEventListener('click', reset);

    document.addEventListener('keydown', event => {
      if (event.defaultPrevented || event.ctrlKey || event.metaKey || event.altKey || state.tutorialOpen) return;

      const number = keyNumber(event);
      if (!number || shouldLetInputKeepNumber(event)) return;

      event.preventDefault();
      submitReveal(number);
    });

    sync(false);
    wordInput.focus();
  </script>
</body>
</html>
